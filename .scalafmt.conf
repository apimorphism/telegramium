version = "3.11.5"
align.preset = more
maxColumn = 120
continuationIndent.defnSite = 2
assumeStandardLibraryStripMargin = true
danglingParentheses.preset = true
runner.dialect = scala3
project.git = true
project.excludePaths = [
  "glob:**/telegramium-core/src/main/**",
  "glob:**/telegramium-core/src/test/scala-generated/**",
  # a rule's input and expected output, compared to the character
  "glob:**/scalafix/input/**",
  "glob:**/scalafix/output/**"
]
# scalafix compiles a rule as plain Scala 2.13
fileOverride {
  "glob:**/scalafix/rules/**" { runner.dialect = scala213 }
  "glob:**/scalafix/tests/**" { runner.dialect = scala213 }
}
