version = "3.11.5"
align.preset = more
maxColumn = 120
continuationIndent.defnSite = 2
assumeStandardLibraryStripMargin = true
danglingParentheses.preset = true
runner.dialect = scala3
project.git = true
project.excludePaths = [
  "glob:**/telegramium-core/src/main/**"
]
# generated by iozhik: pack arguments, as the wide types have a hundred fields
fileOverride {
  "glob:**/telegramium-core/src/test/scala-generated/**" {
    binPack.callSite = always
    binPack.defnSite = always
    danglingParentheses.callSite = false
    newlines.configStyle.callSite.prefer = false
    align.preset = none
  }
}
