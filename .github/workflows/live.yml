# Runs TelegramLiveSpec against real Telegram (see CONTRIBUTING.md). Hand-written, unlike ci.yml.

name: Live test

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      # core's tests and fixtures can't change what the live test sends
      - 'telegramium-core/src/main/**'
      - 'telegramium-high/**'
      - '.github/workflows/live.yml'

permissions:
  contents: read

jobs:
  live:
    name: Live test
    # fork PRs get no secrets, and a fork's nightly would fail without them and report it in the fork
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'schedule' || github.repository == 'apimorphism/telegramium')
    # a new run waits instead of cancelling the one in progress. A group keeps only its newest waiting run, so nightlies
    # get their own group, where a PR run can't replace one; the test doesn't mind a nightly and a PR run posting at once
    concurrency:
      group: live-test-${{ github.event_name == 'schedule' && 'nightly' || 'other' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # a run takes about 2 minutes; one stuck on Telegram ends here, instead of after GitHub's 6 hours
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1.5.13

      - run: sbt liveTest
        env:
          TELEGRAM_LIVE_BOT_TOKEN: ${{ secrets.TELEGRAM_LIVE_BOT_TOKEN }}
          TELEGRAM_LIVE_CHAT_ID: ${{ secrets.TELEGRAM_LIVE_CHAT_ID }}

  # On scheduled runs, keep a single "Live test failing" issue: open it (or comment on it) on failure, close it on success.
  # A run that timed out or was cancelled counts as failing too: it didn't show the live test passing
  report:
    name: Report
    needs: live
    if: always() && github.event_name == 'schedule' && needs.live.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Live test failing
      RESULT: ${{ needs.live.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          issue=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | first | .number // empty")
          if [ "$RESULT" != success ]; then
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Still failing ($RESULT): $RUN_URL"
            else
              gh issue create --title "$TITLE" --body "The scheduled live test against Telegram ended in $RESULT: $RUN_URL"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --comment "Passing again: $RUN_URL"
          fi
